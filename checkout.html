<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/png" href="img/cara-favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap"><link rel="stylesheet" href="css/studio.css"><title>cara — سفارش</title></head><body><header class="top solid"><a href="index.html" class="logo"><img src="img/cara-logo.png" alt="cara" style="height:44px;width:auto;display:block"></a><nav><a href="builder.html">طراحی دستی</a><a href="upload.html">عکس به الگو</a><a href="gallery.html">گالری</a><a class="btn dark sm" href="checkout.html">سفارش</a></nav></header>
<main class="wrap"><div class="stack"><h1 class="page-title">تقریباً آماده‌ای.</h1>
<div id="result" hidden></div>
<section class="card" id="sumCard"><h2>الگوی تو</h2><div class="sum" id="sum"></div></section>
<section class="card" id="formCard"><h2>اطلاعات سفارش</h2><p class="err" id="err" hidden></p>
<form id="form" novalidate><div class="two"><label class="field full">اسم<input name="firstName" required maxlength="60" autocomplete="given-name" placeholder=" "></label><label class="field full">فامیلی<input name="lastName" required maxlength="60" autocomplete="family-name" placeholder=" "></label></div>
<label class="field full">شماره موبایل<input name="phone" required inputmode="tel" autocomplete="tel" placeholder="09123456789" dir="ltr" style="text-align:right"></label>
<label class="field full">آدرس تحویل<textarea name="address" rows="4" required maxlength="500" autocomplete="street-address"></textarea></label>
<button class="btn dark" id="pay" type="submit" style="width:100%">ادامه و پرداخت</button></form></section></div></main>
<script src="js/palette.js"></script><script src="js/checkout-work.js"></script><script src="js/checkout.js"></script></body></html>
