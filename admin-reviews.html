<!doctype html>
<html lang="fa" dir="rtl">
  <head>
<script>try{var t=localStorage.getItem("cara-theme")||"auto",d=t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches),e=document.documentElement;e.setAttribute("data-theme",d?"dark":"light");e.setAttribute("data-theme-mode",t)}catch(n){}</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>نظرات خریداران | پنل کارا</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/img/cara-favicon.png?v=2" />
    <link rel="stylesheet" href="/css/fonts.css" />
    <style>
      :root { color-scheme: light dark; --line: rgba(128,128,128,.28); --gold: #b8975a; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "Vazir", system-ui, sans-serif; background: #f4f1f7; color: #262033; }
      @media (prefers-color-scheme: dark) { body { background: #17151c; color: #eee; } }
      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      header h1 { font-size: 20px; margin: 0; }
      a { color: inherit; }
      .wrap { max-width: 900px; margin: 0 auto; padding: 22px 16px 60px; }
      .panel { border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin: 0 0 14px; background: rgba(255,255,255,.5); }
      @media (prefers-color-scheme: dark) { .panel { background: rgba(255,255,255,.04); } }
      .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      input, select, textarea, button { font: inherit; }
      input, select { padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: inherit; }
      button { padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; font-weight: 700; }
      button.primary { background: #343b64; color: #fff; border-color: #343b64; }
      button.ok { background: #1f7a4d; color: #fff; border-color: #1f7a4d; }
      button.bad { background: #a33027; color: #fff; border-color: #a33027; }
      button:disabled { opacity: .5; cursor: wait; }
      .review { border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 10px 0; }
      .review .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
      .review .stars { color: var(--gold); letter-spacing: 2px; }
      .review p { line-height: 1.9; margin: 8px 0; white-space: pre-wrap; }
      .review small { opacity: .7; }
      .msg { min-height: 1.6em; line-height: 1.8; }
      .err { color: #c93a2b; }
      .empty { opacity: .7; text-align: center; padding: 24px; }
    </style>
  <link rel="stylesheet" href="/css/theme.css?v=20261121-pass6"><script src="/js/theme.js?v=3" defer></script>
</head>
  <body>
    <header>
      <h1>نظرات خریداران</h1>
      <div class="bar"><a href="/admin.html">سفارش‌ها</a><a href="/">سایت</a></div>
    </header>
    <main class="wrap">
      <section class="panel" id="login">
        <h2>ورود با توکن ادمین</h2>
        <div class="bar">
          <label for="token">ADMIN_TOKEN</label>
          <input id="token" type="password" autocomplete="current-password" dir="ltr" />
          <button class="primary" id="enter" type="button">ورود</button>
        </div>
        <p class="msg err" id="loginMsg" role="status" aria-live="polite"></p>
      </section>
      <section id="app" hidden>
        <div class="panel">
          <div class="bar">
            <label for="status">نمایش</label>
            <select id="status">
              <option value="pending">در انتظار تأیید</option>
              <option value="approved">تأییدشده</option>
              <option value="rejected">ردشده</option>
              <option value="all">همه</option>
            </select>
            <button id="reload" type="button">به‌روزرسانی</button>
            <button id="logout" type="button">خروج</button>
          </div>
          <p class="msg" id="msg" role="status" aria-live="polite"></p>
        </div>
        <div id="list"></div>
      </section>
    </main>
    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        const esc = (v) => String(v == null ? "" : v).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        const fa = (n) => Number(n || 0).toLocaleString("fa-IR");
        let token = sessionStorage.getItem("cara-admin") || "";
        const msg = (text, error) => { const el = $("msg"); el.textContent = text || ""; el.classList.toggle("err", !!error); };
        async function api(path, body) {
          const r = await fetch(path, {
            method: body ? "POST" : "GET",
            headers: { Authorization: "Bearer " + token, ...(body ? { "Content-Type": "application/json" } : {}) },
            body: body ? JSON.stringify(body) : undefined,
          });
          const data = await r.json().catch(() => ({}));
          if (r.status === 401) throw new Error("401");
          if (!r.ok) throw new Error(data.error || "خطا " + r.status);
          return data;
        }
        function login(message) {
          $("app").hidden = true;
          $("login").hidden = false;
          $("loginMsg").textContent = message || "";
        }
        async function load() {
          try {
            const data = await api("/api/admin/reviews?status=" + encodeURIComponent($("status").value));
            $("login").hidden = true;
            $("app").hidden = false;
            const list = $("list");
            list.replaceChildren();
            if (!data.reviews.length) {
              const empty = document.createElement("p");
              empty.className = "panel empty";
              empty.textContent = "چیزی برای نمایش نیست.";
              list.append(empty);
              return;
            }
            data.reviews.forEach((review) => {
              const card = document.createElement("article");
              card.className = "panel review";
              card.innerHTML = `<div class="top"><b>${esc(review.author_name || "خریدار")}</b><span class="stars" aria-label="امتیاز ${fa(review.rating)}">${"★".repeat(review.rating)}${"☆".repeat(5 - review.rating)}</span></div>
                <small>دستبند: ${esc(review.work_id)} · ${esc(new Date(review.created_at * 1000).toLocaleString("fa-IR"))}</small>
                <p>${esc(review.body)}</p>
                <div class="bar">
                  <button class="ok" data-action="approve" data-id="${esc(review.id)}"${review.status === "approved" ? " disabled" : ""}>تأیید</button>
                  <button class="bad" data-action="reject" data-id="${esc(review.id)}"${review.status === "rejected" ? " disabled" : ""}>رد</button>
                </div>`;
              list.append(card);
            });
          } catch (error) {
            if (error.message === "401") login("توکن درست نیست.");
            else msg(error.message, true);
          }
        }
        $("enter").addEventListener("click", () => {
          token = $("token").value.trim();
          sessionStorage.setItem("cara-admin", token);
          msg("");
          load();
        });
        $("token").addEventListener("keydown", (event) => { if (event.key === "Enter") $("enter").click(); });
        $("reload").addEventListener("click", load);
        $("status").addEventListener("change", load);
        $("logout").addEventListener("click", () => { sessionStorage.removeItem("cara-admin"); token = ""; login(""); });
        $("list").addEventListener("click", async (event) => {
          const button = event.target.closest("button[data-action]");
          if (!button) return;
          button.disabled = true;
          try {
            await api("/api/admin/reviews", { id: button.dataset.id, action: button.dataset.action });
            msg(button.dataset.action === "approve" ? "نظر تأیید شد." : "نظر رد شد.");
            await load();
          } catch (error) { msg(error.message, true); button.disabled = false; }
        });
        if (token) load(); else login("");
      })();
    </script>
  <script src="/lib/works-pricing.js?v=2"></script><script src="/js/sale.js?v=2" defer></script>
</body>
</html>
