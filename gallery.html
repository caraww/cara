  <body>
    <header class="top solid">
      <a href="index.html" class="logo"
        ><img
          src="img/cara-logo.png"
          alt="cara"
          style="height: 44px; width: auto; display: block"
      /></a>
      <nav>
        <a href="builder.html">طراحی دستی</a
        ><a href="upload.html">عکس به الگو</a><a href="gallery.html">گالری</a
        ><a class="btn dark sm" href="checkout.html">سفارش</a>
      </nav>
    </header>
    <main class="wrap">
      <h1 class="page-title">گالری دستبندها</h1>
      <p class="sub">
        چندتا از کارهایی که خودم بافتم. هر کدوم رو خواستی همین‌جا سفارش بده یا
        ازش الگو بساز.
      </p>
      <div class="gal-tools" id="wkTools">
        <input id="q" type="search" placeholder="جستجو…" aria-label="جستجو" />
        <div class="chipbar" id="tagbar"></div>
        <button class="tool" id="favOnly" aria-pressed="false">
          ♥ علاقه‌مندی‌ها</button
        ><button class="tool" id="surprise">یکی بیار برام</button
        ><span class="wk-count" id="wkCount"></span>
      </div>
      <div class="wk-grid" id="wkGrid"></div>
      <p class="muted" id="empty" hidden></p>
    </main>
    <dialog class="wk-lb" id="lb">
      <div class="wk-stage">
        <button class="wk-x" id="lbClose" aria-label="بستن">×</button
        ><button class="wk-nav prev" id="lbPrev" aria-label="قبلی">›</button
        ><img id="lbImg" alt="" />
        <div class="wk-thumbs" id="lbThumbs" hidden></div>
        <button class="wk-nav next" id="lbNext" aria-label="بعدی">‹</button>
      </div>
      <div class="wk-info">
        <h2 id="lbTitle"></h2>
        <p id="lbNote" class="muted" hidden></p>
        <div class="tags" id="lbTags"></div>
        <span id="lbPrice"></span><small class="muted" id="lbNum"></small>
        <div class="btns">
          <a class="btn" id="lbOrder" href="checkout.html">سفارش این دستبند</a
          ><a class="btn" id="lbMake" href="upload.html">ازش الگو بساز</a
          ><button class="btn" id="lbFav" aria-pressed="false">
            علاقه‌مندی
          </button>
        </div>
      </div>
    </dialog>
    <script src="js/palette.js?v=32"></script>

    <script src="js/gallery.js"></script>
