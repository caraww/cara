name: Optimize homepage weaving video

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/optimize-weaving-video.yml
      - tools/trigger-video-optimization.txt

permissions:
  contents: write

concurrency:
  group: optimize-weaving-video-v4
  cancel-in-progress: false

jobs:
  optimize:
    if: github.event.head_commit.message == 'Run homepage video optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install FFmpeg static binary
        run: |
          npm install --no-save ffmpeg-static
          ffmpeg_path=$(node -p "require('ffmpeg-static')")
          test -x "$ffmpeg_path"
          echo "$(dirname "$ffmpeg_path")" >> "$GITHUB_PATH"

      - name: Verify source video
        run: |
          test -s media/cara-weaving.MP4
          ffmpeg -v error -i media/cara-weaving.MP4 -map 0:v:0 -frames:v 1 -f null -

      - name: Encode web-optimized MP4
        run: |
          ffmpeg -hide_banner -y -i media/cara-weaving.MP4 \
            -map 0:v:0 -map '0:a?' \
            -vf "scale='min(720,iw)':-2:force_original_aspect_ratio=decrease" \
            -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -movflags +faststart \
            -sn -dn media/cara-weaving.optimized.mp4
          test -s media/cara-weaving.optimized.mp4
          ffmpeg -v error -i media/cara-weaving.optimized.mp4 -map 0:v:0 -frames:v 1 -f null -

      - name: Replace source only when optimized file is smaller
        run: |
          original=$(stat -c%s media/cara-weaving.MP4)
          optimized=$(stat -c%s media/cara-weaving.optimized.mp4)
          echo "Original bytes: $original"
          echo "Optimized bytes: $optimized"
          if [ "$optimized" -ge "$original" ]; then
            echo "Optimized output is not smaller; preserving original."
            rm media/cara-weaving.optimized.mp4
            exit 0
          fi
          mv media/cara-weaving.optimized.mp4 media/cara-weaving.MP4
          echo "Saved reduction: $((100 - optimized * 100 / original))%"

      - name: Commit optimized video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/cara-weaving.MP4
          if git diff --cached --quiet; then
            echo "No smaller video to commit."
            exit 0
          fi
          git commit -m "Optimize homepage weaving video for web"
          git push origin HEAD:main
