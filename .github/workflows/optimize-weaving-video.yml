name: Optimize homepage weaving video

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optimize-weaving-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install FFmpeg static binary
        run: |
          npm install --no-save ffmpeg-static
          ffmpeg_path=$(node -p "require('ffmpeg-static')")
          test -x "$ffmpeg_path"
          echo "$(dirname "$ffmpeg_path")" >> "$GITHUB_PATH"

      - name: Verify source video
        run: |
          test -s media/cara-weaving.MP4
          ffmpeg -v error -i media/cara-weaving.MP4 -map 0:v:0 -frames:v 1 -f null -

      - name: Encode web-optimized MP4
        run: |
          ffmpeg -hide_banner -y -i media/cara-weaving.MP4 \
            -map 0:v:0 -map '0:a?' \
            -vf "scale=720:-2" \
            -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -movflags +faststart \
            -sn -dn /tmp/cara-weaving.optimized.mp4
          test -s /tmp/cara-weaving.optimized.mp4
          ffmpeg -v error -i /tmp/cara-weaving.optimized.mp4 -map 0:v:0 -frames:v 1 -f null -

      - name: Compare output size
        id: compare
        run: |
          original=$(stat -c%s media/cara-weaving.MP4)
          optimized=$(stat -c%s /tmp/cara-weaving.optimized.mp4)
          echo "Original bytes: $original"
          echo "Optimized bytes: $optimized"
          if [ "$optimized" -ge "$original" ]; then
            echo "smaller=false" >> "$GITHUB_OUTPUT"
            echo "Output is not smaller; artifact upload will be skipped."
            exit 0
          fi
          echo "smaller=true" >> "$GITHUB_OUTPUT"
          echo "Saved reduction: $((100 - optimized * 100 / original))%"

      - name: Upload optimized video artifact
        if: steps.compare.outputs.smaller == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cara-weaving-optimized
          path: /tmp/cara-weaving.optimized.mp4
          if-no-files-found: ignore
          retention-days: 7
