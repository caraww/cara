name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type DEPLOY to publish the Worker from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cara-cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN as a GitHub Actions secret."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID as a GitHub Actions variable."
            exit 1
          fi

      - name: Validate Worker bundle and configuration
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Deploy Worker to Cloudflare
        run: npx --yes wrangler@4 deploy
