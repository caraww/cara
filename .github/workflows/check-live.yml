name: Check live marker
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          curl -sS --max-time 30 https://caraw.ir/ -o /tmp/live.html
          echo "bytes: $(wc -c < /tmp/live.html)"
          grep -o 'cara-deploy-test[^>]*' /tmp/live.html || echo 'marker missing'
          grep -o 'black-friday[^" ]*' /tmp/live.html | sort -u || true
