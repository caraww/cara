name: Deploy to Iranian host

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "api/**"
      - "css/**"
      - "js/**"
      - "img/**"
      - "media/**"
      - "fonts/**"
      - "data/**"
      - "lib/works-pricing.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "tools/package-static.js"
      - ".github/workflows/deploy-iran.yml"

concurrency:
  group: deploy-iran
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build static bundle
        run: node tools/package-static.js
      - name: Remove server-only files from bundle
        run: rm -f dist/site/.htaccess
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Check FTP secrets
        id: ftp
        env:
          FTP_HOST: ${{ secrets.IRAN_FTP_HOST }}
          FTP_USER: ${{ secrets.IRAN_FTP_USER }}
          FTP_PASS: ${{ secrets.IRAN_FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_HOST" ] && [ -n "$FTP_USER" ] && [ -n "$FTP_PASS" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FTP secrets are not configured; skipping upload."
          fi
      - name: Upload changed files
        if: steps.ftp.outputs.configured == 'true'
        env:
          FTP_HOST: ${{ secrets.IRAN_FTP_HOST }}
          FTP_USER: ${{ secrets.IRAN_FTP_USER }}
          FTP_PASS: ${{ secrets.IRAN_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.IRAN_FTP_DIR }}
          BASE_SHA: ${{ vars.DEPLOY_BASE_SHA }}
        run: |
          set -euo pipefail
          BASE_SHA="${BASE_SHA:-d971329}"
          rm -rf dist/upload
          mkdir -p dist/upload
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::Base commit $BASE_SHA not found; uploading text assets only."
            lftp -c "
              set ftp:ssl-allow yes;
              set ssl:verify-certificate no;
              set ftp:passive-mode yes;
              set net:max-retries 3;
              open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
              mirror -R --only-newer --parallel=8 --verbose=1 --exclude-glob '*.webp' --exclude-glob '*.avif' --exclude-glob '*.png' --exclude-glob '*.jpg' --exclude-glob '*.jpeg' --exclude-glob '*.gif' --exclude-glob '*.mp4' --exclude-glob '*.webm' dist/site/ \"${FTP_DIR:-public_html}\";
              bye
            "
            exit 0
          fi
          : > /tmp/deploy-files
          git diff --name-only -z "${BASE_SHA}..${GITHUB_SHA}" | while IFS= read -r -d '' path; do
            [ -f "dist/site/$path" ] && printf '%s\0' "$path" >> /tmp/deploy-files
          done
          find dist/site/fonts -type f -printf 'fonts/%P\0' >> /tmp/deploy-files 2>/dev/null || true
          [ -f dist/site/css/fonts.css ] && printf 'css/fonts.css\0' >> /tmp/deploy-files
          while IFS= read -r -d '' path; do
            mkdir -p "dist/upload/$(dirname "$path")"
            cp -p "dist/site/$path" "dist/upload/$path"
          done < /tmp/deploy-files
          echo "Uploading $(find dist/upload -type f | wc -l) changed files."
          lftp -c "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            set net:max-retries 3;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            mirror -R --parallel=8 --verbose=1 dist/upload/ \"${FTP_DIR:-public_html}\";
            bye
          "
      - name: Verify API proxy
        if: steps.ftp.outputs.configured == 'true'
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/api.json -w '%{http_code}' --max-time 20 https://caraw.ir/api/config || true)
            echo "attempt $i: HTTP $code"
            cat /tmp/api.json || true
            echo
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::The /api proxy on caraw.ir is not returning 200. Check api/.htaccess and mod_proxy on the host."
          exit 1
