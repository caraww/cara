name: Apply customer accounts migration (production)

on:
  workflow_dispatch:
    inputs:
      confirm_production_migration:
        description: Type APPLY_PRODUCTION_MIGRATION to apply migrations to cara-accounts-production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cara-accounts-production-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && inputs.confirm_production_migration == 'APPLY_PRODUCTION_MIGRATION'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN as a GitHub Actions secret."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID as a GitHub Actions variable."
            exit 1
          fi

      - name: Apply migrations to production D1
        run: npx --yes wrangler@4 d1 migrations apply cara-accounts-production --remote --config wrangler.production-migrations.jsonc
