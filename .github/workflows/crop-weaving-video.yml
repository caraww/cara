name: Crop InShot watermark from weaving video

on:
  push:
    branches: [main]
    paths:
      - tools/trigger-video-crop.txt

permissions:
  contents: write

concurrency:
  group: crop-weaving-video
  cancel-in-progress: false

jobs:
  crop:
    if: github.event.head_commit.message == 'Crop InShot watermark from weaving video'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Crop lower edge and encode
        run: |
          set -euo pipefail
          input=media/cara-weaving.MP4
          test -s "$input"
          cp "$input" /tmp/cara-weaving-original.MP4
          ffmpeg -hide_banner -y -i "$input" \
            -map 0:v:0 -map '0:a?' \
            -vf "crop=iw:ih-90:0:0" \
            -c:v libx264 -preset slow -crf 24 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -movflags +faststart -sn -dn \
            /tmp/cara-weaving-cropped.MP4
          test -s /tmp/cara-weaving-cropped.MP4
          ffmpeg -v error -i /tmp/cara-weaving-cropped.MP4 -map 0:v:0 -frames:v 1 -f null -
          mv /tmp/cara-weaving-cropped.MP4 "$input"
      - name: Commit cropped video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/cara-weaving.MP4
          git commit -m "Crop InShot watermark from weaving video"
          git push origin HEAD:main
