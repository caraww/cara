name: Crop InShot watermark from weaving video

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crop-weaving-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Crop lower edge and encode
        run: |
          set -euo pipefail
          input=media/cara-weaving.MP4
          test -s "$input"
          ffmpeg -hide_banner -y -i "$input" \
            -map 0:v:0 -map '0:a?' \
            -vf "crop=iw:ih-90:0:0" \
            -c:v libx264 -preset slow -crf 24 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -movflags +faststart -sn -dn \
            /tmp/cara-weaving-cropped.MP4
          test -s /tmp/cara-weaving-cropped.MP4
          ffmpeg -v error -i /tmp/cara-weaving-cropped.MP4 -map 0:v:0 -frames:v 1 -f null -

      - name: Upload cropped video artifact
        uses: actions/upload-artifact@v4
        with:
          name: cara-weaving-cropped
          path: /tmp/cara-weaving-cropped.MP4
          retention-days: 7
