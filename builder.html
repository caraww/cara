<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="img/cara-favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap"
    />
    <link rel="stylesheet" href="css/studio.css" />
    <title>طراحی دستبند منجوقی آنلاین | سازنده الگوی cara</title>
    <meta name="description" content="طراحی دستبند منجوقی آنلاین و رایگان: خونه‌به‌خونه با ۳۲ رنگ منجوق میوکی الگو بکش، پیش‌نمایش روی مچ ببین و سفارش بده." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1d1527" />
    <link rel="canonical" href="https://caraw.ir/builder.html" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:site_name" content="cara" />
    <meta property="og:title" content="طراحی دستبند منجوقی آنلاین با cara" />
    <meta property="og:description" content="طراحی دستبند منجوقی آنلاین و رایگان: خونه‌به‌خونه با ۳۲ رنگ منجوق میوکی الگو بکش، پیش‌نمایش روی مچ ببین و سفارش بده." />
    <meta property="og:url" content="https://caraw.ir/builder.html" />
    <meta property="og:image" content="https://caraw.ir/img/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="css/delight.css" />
    <link rel="stylesheet" href="css/studio-controls.css" />
    <link rel="stylesheet" href="css/details.css" />
    <link rel="stylesheet" href="css/polish.css" />
  </head>
  <body>
    <header class="top solid">
      <a href="index.html" class="logo"
        ><img
          src="img/cara-logo.png"
          alt="cara"
          style="height: 44px; width: auto; display: block"
      /></a>
      <nav>
        <a href="builder.html">طراحی دستی</a
        ><a href="upload.html">عکس به الگو</a><a href="gallery.html">گالری</a
        ><a class="btn dark sm" href="checkout.html">سفارش</a>
      </nav>
    </header>
    <main class="wrap">
      <div class="builder">
        <aside class="panel">
          <h2>رنگ‌ها</h2>
          <div
            id="palette"
            class="palette"
            role="group"
            aria-label="پالت منجوق"
          ></div>
          <div class="current">
            <i id="curDot"></i>
            <div><b id="curName"></b><small id="curCode"></small></div>
          </div>
        </aside>
        <section class="panel">
          <div class="head">
            <div>
              <h1 class="page-title">دستبندت رو خودت بساز</h1>
              <p class="sub" style="margin: 0">
                هر خونه یه منجوقه. برای پاک کردن راست‌کلیک کن یا از پاک‌کن
                استفاده کن.
              </p>
            </div>
            <div class="dims">
              <label
                >عرض
                <input
                  id="w"
                  type="number"
                  min="1"
                  max="40"
                  value="15" /></label
              >×<label
                >طول <input id="h" type="number" min="1" max="200" value="80"
              /></label>
            </div>
          </div>
          <p id="warn" class="warn" role="alert" hidden>
            دستبندت داره خیلی پهن میشه ها!
          </p>
          <div class="tools">
            <div class="grp">
              <button class="tool" data-tool="brush" aria-pressed="true">
                قلم (B)</button
              ><button class="tool" data-tool="eraser" aria-pressed="false">
                پاک‌کن (E)
              </button>
              <button class="tool" data-tool="fill" aria-pressed="false">
                سطل (G)</button
              ><button class="tool" data-tool="pan" aria-pressed="false">
                جابه‌جایی
              </button>
            </div>
            <div class="grp">
              <button class="tool" id="mirror" aria-pressed="false">آینه</button
              ><button class="tool" id="undo">↶ برگشت</button
              ><button class="tool" id="clear">پاک کردن همه</button>
            </div>
            <span class="grow"></span><span class="muted" id="saved"></span>
            <div class="grp">
              <button class="tool" id="export">دانلود چارت</button
              ><a class="btn accent sm" id="next" href="checkout.html"
                >ادامه سفارش</a
              >
            </div>
          </div>
          <div class="grid-wrap" id="gridWrap">
            <canvas id="grid" aria-label="گرید طراحی"></canvas
            ><i class="ghost" id="ghost" hidden></i>
          </div>
          <div class="statusbar">
            <span id="pos">—</span><span>ابزار: <b id="toolName">قلم</b></span
            ><span>Space + کشیدن = جابه‌جایی</span>
          </div>
        </section>
        <aside class="panel summary">
          <h2>پیش‌نمایش روی مچ</h2>
          <div class="wristbox">
            <canvas id="wrist" aria-label="پیش‌نمایش دستبند"></canvas>
          </div>
          <h2 class="h2b">خلاصه</h2>
          <div class="stat">
            <span>تعداد منجوق</span><strong id="total">۰</strong>
          </div>
          <div class="stat">
            <span>ابعاد</span><strong id="dimText"></strong>
          </div>
          <div class="colors" id="colors"></div>
        </aside>
      </div>
    </main>
    <script src="js/palette.js?v=32"></script>
    <script src="js/builder.js"></script>
    <script src="js/delight.js?v=1" defer></script>
  </body>
</html>
