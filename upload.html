<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/png" href="img/cara-favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap"><link rel="stylesheet" href="css/studio.css"><title>cara — عکس به الگو</title><link rel="stylesheet" href="css/delight.css"><link rel="stylesheet" href="css/studio-controls.css"><link rel="stylesheet" href="css/details.css"></head><body><header class="top solid"><a href="index.html" class="logo"><img src="img/cara-logo.png" alt="cara" style="height:44px;width:auto;display:block"></a><nav><a href="builder.html">طراحی دستی</a><a href="upload.html">عکس به الگو</a><a href="gallery.html">گالری</a><a class="btn dark sm" href="checkout.html">سفارش</a></nav></header>
<main class="wrap narrow"><h1 class="page-title">عکس رو تبدیل کن به الگوی دستبند</h1><p class="sub">رنگ هر خونه با نزدیک‌ترین منجوق موجود عوض می‌شه. عکس ساده و پررنگ بهتر جواب می‌ده.</p>
<label class="drop" id="drop"><b>عکس رو بنداز اینجا یا کلیک کن</b><span class="muted">JPG، PNG یا WebP</span><input id="file" type="file" accept="image/*"></label>
<div class="controls"><label class="field">عرض<input id="w" type="number" min="1" max="40" value="15"></label><label class="field">طول<input id="h" type="number" min="1" max="200" value="80"></label>
<label class="field">برش<select id="fit"><option value="cover">پر کردن (لبه‌ها بریده می‌شه)</option><option value="contain">کل عکس (با حاشیه‌ی سفید)</option></select></label>
<label class="check"><input id="dither" type="checkbox"> سایه‌روشن (برای چهره و عکس واقعی)</label></div>
<p id="warn" class="warn" role="alert" hidden>دستبندت داره خیلی پهن میشه ها!</p>
<div class="preview"><canvas id="out" hidden></canvas><div class="msg" id="msg">هنوز عکسی انتخاب نشده.</div></div>
<div class="btns" style="margin-top:18px"><a class="btn dark" href="builder.html">ویرایشش کن</a><a class="btn" href="checkout.html">ادامه سفارش</a></div>
</main><script src="js/palette.js?v=32"></script><script src="js/upload.js"></script><script src="js/delight.js?v=1" defer></script></body></html>
